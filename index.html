<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIS – Phòng XN Y Khoa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/styles.css?v=1.5.4">
</head>
<body>
  <div id="loading-bar"></div>

  <!-- ============================ LOGIN ============================ -->
  <section id="login-view">
    <div class="login-bg" id="login-bg" aria-hidden="true"></div>
    <div class="login-dim" id="login-dim" aria-hidden="true"></div>
    <header class="login-top">
      <div class="login-brand">
        <div class="brand-logo" data-logo></div>
        <div><div class="lb-name" data-clinic-name>PHÒNG XN Y KHOA</div><div class="lb-sub">Laboratory Information System</div></div>
      </div>
    </header>
    <main class="login-center">
      <form class="login-card" id="login-form" autocomplete="on">
        <div class="lc-head">
          <div class="brand-logo lc-logo" data-logo></div>
          <h1>Đăng nhập hệ thống</h1>
          <p>Quản lý phiếu xét nghiệm, kết quả và báo cáo</p>
        </div>
        <div class="lc-group">
          <label class="lc-label" for="login-user">Tên đăng nhập</label>
          <div class="lc-field"><i class="bi bi-person" aria-hidden="true"></i>
            <input id="login-user" name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required autofocus></div>
        </div>
        <div class="lc-group">
          <label class="lc-label" for="login-pass">Mật khẩu</label>
          <div class="lc-field"><i class="bi bi-lock" aria-hidden="true"></i>
            <input id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
            <button type="button" class="lc-eye" id="toggle-pass" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button></div>
        </div>
        <div class="alert alert-danger py-2 small d-none mb-0" id="login-error"></div>
        <button class="lc-submit" type="submit" id="login-btn">Đăng nhập</button>
        <div class="lc-foot">LIS <span data-app-version></span></div>
      </form>
    </main>
    <footer class="login-copy">© <span id="login-year"></span> <span data-clinic-name>PHÒNG XN Y KHOA</span> · Kết nối bảo mật</footer>
  </section>

  <!-- ============================ APP SHELL ============================ -->
  <section id="app-view">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" data-logo></div>
        <div><div class="brand-name" data-clinic-name>PHÒNG XN Y KHOA</div><div class="brand-sub">Laboratory Information System</div></div>
      </div>
      <nav id="nav"></nav>
      <div class="user-box">
        <div class="fw-semibold text-white" id="user-name"></div>
        <div class="opacity-75 mb-2" id="user-role"></div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-light" id="btn-change-pass"><i class="bi bi-key"></i> Mật khẩu</button>
          <button class="btn btn-sm btn-light" id="btn-logout"><i class="bi bi-box-arrow-right"></i> Thoát</button>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-sm btn-outline-secondary" id="menu-toggle" aria-label="Menu"><i class="bi bi-list"></i></button>
        <h2 id="page-title"></h2>
        <span class="demo-banner d-none" id="demo-banner">DEMO</span>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="text-muted small d-none d-md-inline" id="today-label"></span>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </section>

  <div class="modal fade" id="app-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable"><div class="modal-content" id="app-modal-content"></div></div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
  <iframe id="print-frame" title="print" style="position:fixed;width:900px;height:1300px;border:0;left:-10000px;top:0"></iframe>

  <script src="config.js?v=1.5.4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="assets/api.js?v=1.5.4"></script>
  <script src="assets/app.js?v=1.5.4"></script>
  <script src="assets/views-order.js?v=1.5.4"></script>
  <script src="assets/views-admin.js?v=1.5.4"></script>
</body>
</html>
